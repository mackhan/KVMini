name: Release

on:
  push:
    tags:
      - 'v*'

# 确保同一时间只有一个 release workflow 在运行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 版本号校验 ──────────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG_VERSION"

      - name: Validate version consistency
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep -m1 'version = "' Cargo.toml | head -1 | sed 's/.*version = "\(.*\)"/\1/')
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Tag version:   $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          echo "NPM version:   $PKG_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

          echo "✅ Version consistency check passed: $TAG_VERSION"

  # ── 构建 + 发布 ────────────────────────────────────────────────────────
  build:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M芯片)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
            os_name: 'macos-aarch64'

          # macOS Intel
          - platform: macos-13
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
            os_name: 'macos-x86_64'

          # Windows
          - platform: windows-latest
            args: ''
            rust_target: ''
            os_name: 'windows-x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Node.js 安装 ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # ── Rust 安装 ──
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # ── Rust 缓存 ──
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── 前端依赖安装 ──
      - name: Install frontend dependencies
        run: npm install

      # ── macOS: 导入签名证书 ──
      - name: Import Apple Certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set, skipping code signing"
            exit 0
          fi

          # 创建临时 Keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入证书
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "✅ Apple certificate imported"

      # ── 构建 + 发布（使用 Tauri Action） ──
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater 签名
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 公证（可选，缺少时跳过）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # macOS 签名身份
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: v__VERSION__
          releaseName: 'KVMini v__VERSION__'
          releaseBody: |
            ## KVMini v__VERSION__

            ### 下载说明 / Download Instructions

            | 平台 Platform | 文件 File | 说明 Notes |
            |---|---|---|
            | macOS (Apple Silicon / M芯片) | `KVMini_*_aarch64.dmg` | M1/M2/M3/M4 芯片 |
            | macOS (Intel) | `KVMini_*_x64.dmg` | Intel 芯片 |
            | Windows | `KVMini_*_x64-setup.exe` | 64位 Windows 10+ |

            ### ⚠️ macOS 首次打开
            如果提示"无法验证开发者"，请右键点击 → 打开（仅需一次）。

            ### 更新说明 / Changelog
            详见应用内"设置 → 关于 → 更新日志"。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # ── macOS: 清理 Keychain ──
      - name: Cleanup Keychain (macOS)
        if: runner.os == 'macOS' && always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

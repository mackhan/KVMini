[package]
name = "kvm-share"
version = "0.1.5"
description = "Cross-platform mouse and keyboard sharing software"
authors = ["KVM Share Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.8", features = [ "shell-open", "system-tray", "notification-all", "global-shortcut"] }
tokio = { version = "1.0", features = ["full"] }
lazy_static = "1.4"
dirs = "5.0"
log = "0.4"
rcgen = "0.13"
sha2 = "0.10"
if-addrs = "0.13"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.0"

[dev-dependencies]
tempfile = "3.0"

# macOS 平台特定依赖
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"

# Windows 平台特定依赖
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winbase", "processthreadsapi", "libloaderapi"] }
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = []

[package]
name = "kvmini"
version.workspace = true
description = "Cross-platform mouse and keyboard sharing software"
authors = ["KVMini Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kvm-core = { path = "../kvm-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [ "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1.0", features = ["full"] }
lazy_static = "1.4"
dirs = "5.0"
log = "0.4"
env_logger = "0.11"
if-addrs = "0.13"
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
# tauri-commerce SDK - 直接下载版（默认/开发阶段）
# 使用 Git tag 引用，升级时只需更新 tag 版本号
tauri-commerce = { git = "https://github.com/mackhan/tauri-commerce", tag = "v0.1.2", default-features = false, features = ["trial", "i18n", "permissions", "feedback", "review", "autostart", "changelog", "privacy"] }
# App Store 版（构建时切换 features，取消注释下行并注释上行）：
# tauri-commerce = { git = "https://github.com/mackhan/tauri-commerce", tag = "v0.1.2", default-features = false, features = ["trial", "iap", "i18n", "permissions", "feedback", "review", "autostart"] }

[dev-dependencies]
tempfile = "3.0"

# macOS 平台特定依赖
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = { version = "0.23", features = ["highsierra"] }
objc = "0.2"
block = "0.1"

# Windows 平台特定依赖
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winbase", "processthreadsapi", "libloaderapi"] }
winreg = "0.52"

[features]
default = []

[lints.rust]
# objc 0.2 的宏会产生 unexpected_cfgs(cargo-clippy) warning，这是上游问题
unexpected_cfgs = "allow"


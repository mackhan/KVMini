[package]
name = "kvm-share"
version = "0.1.3"
description = "Cross-platform mouse and keyboard sharing software"
authors = ["KVM Share Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.8", features = [ "shell-open", "system-tray", "notification-all"] }
tokio = { version = "1.0", features = ["full"] }
lazy_static = "1.4"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.0"

# macOS 平台特定依赖
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

# Windows 平台特定依赖（后续集成时启用）
# [target.'cfg(target_os = "windows")'.dependencies]
# winapi = { version = "0.3", features = ["winuser", "winbase"] }

# 其他平台特定依赖（后续集成时启用）
# libusb = "0.3"
# core-graphics = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = []

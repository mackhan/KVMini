[workspace]
members = [
    "kvm-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.18"
edition = "2021"
authors = ["KVMini Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
thiserror = "2.0"
bincode = "1.3"

# 修复 macOS 26 (Tahoe) beta 启动崩溃问题
# 根因：objc2-0.6.4 的 MainThreadMarker::new() 使用 pthread_main_np() == 1 检测主线程
# macOS 26 beta 在 applicationDidFinishLaunching 中 pthread_main_np() 返回 -1
# 修复：将 == 1 改为 != 0，符合 Apple 头文件语义（非零即主线程）
[patch.crates-io]
objc2 = { path = "patches/objc2-0.6.4" }
tao = { path = "patches/tao-0.34.8" }
tauri-runtime-wry = { path = "patches/tauri-runtime-wry-2.10.1" }
tauri = { path = "patches/tauri-2.10.3" }


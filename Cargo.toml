[workspace]
members = [
    "kvm-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["KVM Share Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
thiserror = "2.0"
bincode = "1.3"

[package]
name = "kvm-agent"
version = "0.2.0"
description = "KVM Agent - Mac 端 KVM 程序（支持主控端/被控端角色切换）"
authors = ["KVM Share Team"]
license = "MIT"
edition = "2021"

[[bin]]
name = "kvm-agent"
path = "src/main.rs"

[dependencies]

# macOS 特定依赖（仅在 macOS 上编译）
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
objc = "0.2"

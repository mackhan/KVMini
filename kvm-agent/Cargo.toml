[package]
name = "kvm-agent"
version = "0.1.0"
description = "KVM Agent - Mac 端被控端程序"
authors = ["KVM Share Team"]
license = "MIT"
edition = "2021"

[[bin]]
name = "kvm-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

# macOS 特定依赖（仅在 macOS 上编译）
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
objc = "0.2"

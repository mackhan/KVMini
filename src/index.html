<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVM Share - 跨平台键鼠共享</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 错误提示横幅 -->
    <div id="error-banner" class="error-banner" style="display:none;">
        <span id="error-msg" class="error-msg"></span>
        <button id="error-close" class="error-close" title="关闭">✕</button>
    </div>

    <div class="container">
        <header>
            <h1>KVM Share</h1>
            <p>跨平台鼠标键盘共享软件</p>
        </header>
        
        <div class="status-panel">
            <div class="status-item">
                <span class="status-label">连接状态:</span>
                <span id="connection-status" class="status-disconnected">断开</span>
            </div>
            <div class="status-item">
                <span class="status-label">已连接设备:</span>
                <span id="connected-device">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">连接方式:</span>
                <span id="connection-type">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">本机 IP:</span>
                <span id="local-ip">获取中...</span>
            </div>
            <div class="status-item">
                <span class="status-label">延迟:</span>
                <span id="latency">-</span>
            </div>
        </div>

        <div class="controls">
            <button id="connect-btn" class="btn btn-primary">扫描设备</button>
            <button id="disconnect-btn" class="btn btn-secondary" disabled>断开连接</button>
            <button id="settings-btn" class="btn btn-outline">设置</button>
        </div>

        <div class="devices-panel">
            <h3>可用设备</h3>
            <div id="devices-list" class="devices-list">
                <div class="no-devices">未发现设备，等待 KVM Agent 响应...</div>
            </div>
        </div>

        <div class="hint-panel">
            <p class="hint-text">💡 提示：连接成功后，将鼠标移到屏幕右边缘即可切换到 Mac 控制模式</p>
            <p class="hint-text">💡 按 <kbd>Ctrl+Alt+Tab</kbd> 切换回 Windows 本地控制</p>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>

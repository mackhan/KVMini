<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVM Share - 跨平台键鼠共享</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header>
            <h1>KVM Share</h1>
            <p>跨平台鼠标键盘共享软件</p>
        </header>

        <!-- 状态面板 -->
        <div class="status-panel">
            <div class="status-item">
                <span class="status-label">连接状态:</span>
                <span id="connection-status" class="status-disconnected">断开</span>
            </div>
            <div class="status-item">
                <span class="status-label">连接方式:</span>
                <span id="connection-type">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">延迟:</span>
                <span id="latency">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">本机 IP:</span>
                <span id="local-ip">获取中...</span>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button id="connect-btn" class="btn btn-primary">连接设备</button>
            <button id="disconnect-btn" class="btn btn-secondary" disabled>断开连接</button>
            <button id="settings-btn" class="btn btn-outline">⚙ 设置</button>
        </div>

        <!-- 设备发现面板 -->
        <div class="devices-panel">
            <div class="devices-panel-header">
                <h3>可用设备</h3>
                <button id="scan-btn" class="btn btn-scan">
                    <span id="scan-icon">🔍</span>
                    <span id="scan-text">扫描设备</span>
                </button>
            </div>
            <!-- 扫描动画 -->
            <div id="scan-animation" class="scan-animation hidden">
                <div class="scan-dot"></div>
                <div class="scan-dot"></div>
                <div class="scan-dot"></div>
                <span>正在扫描局域网设备...</span>
            </div>
            <div id="devices-list" class="devices-list">
                <div class="no-devices">点击"扫描设备"发现局域网内的设备</div>
            </div>
        </div>

        <!-- 连接历史面板 -->
        <div class="history-panel">
            <div class="history-panel-header">
                <h3>连接历史</h3>
                <button id="clear-history-btn" class="btn btn-text">清除</button>
            </div>
            <div id="history-list" class="history-list">
                <div class="no-history">暂无连接历史</div>
            </div>
        </div>

        <!-- 错误提示（非 alert） -->
        <div id="error-toast" class="error-toast hidden">
            <span id="error-message"></span>
            <button class="error-close" onclick="hideError()">✕</button>
        </div>

        <!-- 成功提示 -->
        <div id="success-toast" class="success-toast hidden">
            <span id="success-message"></span>
        </div>
    </div>

    <!-- 设置面板（模态框） -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-overlay" onclick="closeSettings()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙ 设置</h2>
                <button class="modal-close" onclick="closeSettings()">✕</button>
            </div>
            <div class="modal-body">
                <!-- 快捷键配置 -->
                <div class="settings-section">
                    <h4>全局快捷键</h4>
                    <div class="settings-item">
                        <label>切换控制焦点:</label>
                        <div class="hotkey-input-group">
                            <input type="text" id="hotkey-input" class="hotkey-input" 
                                   placeholder="点击此处录入快捷键" readonly
                                   data-hotkey="">
                            <button class="btn btn-small" onclick="clearHotkey()">清除</button>
                        </div>
                    </div>
                </div>

                <!-- 连接偏好 -->
                <div class="settings-section">
                    <h4>连接偏好</h4>
                    <div class="settings-item">
                        <label>优先连接方式:</label>
                        <select id="prefer-connection-type" class="settings-select">
                            <option value="auto">自动选择</option>
                            <option value="network">网络优先</option>
                            <option value="usb">USB优先</option>
                        </select>
                    </div>
                    <div class="settings-item">
                        <label>自动重连:</label>
                        <label class="toggle">
                            <input type="checkbox" id="auto-reconnect" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

                <!-- 启动选项 -->
                <div class="settings-section">
                    <h4>启动选项</h4>
                    <div class="settings-item">
                        <label>开机自启动:</label>
                        <label class="toggle">
                            <input type="checkbox" id="auto-start">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="settings-item">
                        <label>启动时最小化到托盘:</label>
                        <label class="toggle">
                            <input type="checkbox" id="start-minimized">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
                <button class="btn btn-outline" onclick="closeSettings()">取消</button>
            </div>
        </div>
    </div>

    <script src="platform.js"></script>
    <script src="main.js"></script>
</body>
</html>
